<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎁 Cadeau Spécial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Gift Button -->
    <div class="gift-container">
        <button class="gift-btn" id="giftBtn">🎁</button>
        <p class="gift-text">Cliquez pour ouvrir le cadeau</p>
    </div>

    <!-- Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <!-- Close Button -->
            <button class="close-btn" id="closeBtn">&times;</button>

            <!-- Photos Carousel -->
            <div class="carousel-container">
                <div class="carousel" id="carousel">
                    <div class="carousel-item">
                        <img src="20260514_151044-COLLAGE.jpg" alt="Photo 1">
                    </div>
                    <div class="carousel-item">
                        <img src="IMG-20260504-WA0067.jpg" alt="Photo 2">
                    </div>
                    <div class="carousel-item">
                        <img src="IMG_20260105_152837_512.jpg" alt="Photo 3">
                    </div>
                    <div class="carousel-item">
                        <img src="IMG_20260430_133347_073.jpg" alt="Photo 4">
                    </div>
                </div>

                <!-- Navigation Dots -->
                <div class="dots-container">
                    <span class="dot active" data-index="0"></span>
                    <span class="dot" data-index="1"></span>
                    <span class="dot" data-index="2"></span>
                    <span class="dot" data-index="3"></span>
                </div>
            </div>

            <!-- Quotes Section -->
            <div class="quotes-section">
                <p class="quote" id="quote">Chaque moment est une opportunité de briller.</p>
                <p class="quote-author" id="quoteAuthor">— Sagesse de vie</p>
                <button class="next-quote-btn" id="nextQuoteBtn">Citation suivante</button>
            </div>

            <!-- Sound is played automatically when opening the gift -->
        </div>
    </div>

    <!-- Hidden Audio Element -->
    <audio id="bgMusic" loop>
        <source src="Adekunle.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
